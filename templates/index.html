<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信抽奖解析器</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="page-container">
        <header class="header">
            <div class="header-left">
                <div class="logo">🎯</div>
                <h1 class="title">微信抽奖解析器</h1>
            </div>
            <div class="header-right">
                <button class="btn-text" id="btn-reupload" style="display: none;">
                    <span>↻</span> 重新上传
                </button>
                <button class="btn-text" id="btn-export" style="display: none;">
                    <span>↓</span> 导出结果
                </button>
            </div>
        </header>

        <main class="main-content">
            <div class="upload-area" id="upload-area">
                <div class="upload-content" id="upload-content">
                    <div class="upload-icon">📤</div>
                    <div class="upload-title">上传图片</div>
                    <div class="upload-subtitle">点击或拖拽微信截图到这里</div>
                </div>
                <div class="upload-progress" id="upload-progress" style="display: none;">
                    <div class="spinner"></div>
                    <div class="progress-text">解析中...</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
                <input type="file" id="file-input" accept=".png,.jpg,.jpeg" hidden>
            </div>

            <div class="lottery-area" id="lottery-area" style="display: none;">
                <div class="participants-grid" id="participants-grid"></div>
                
                <div class="lottery-controls">
                    <button class="btn-primary" id="btn-lottery">
                        <span>🎲</span> 开始抽奖
                    </button>
                </div>

                <div class="winners-section" id="winners-section" style="display: none;">
                    <div class="section-title">
                        <span>🏆</span> 已中奖者
                    </div>
                    <div class="winners-list" id="winners-list"></div>
                </div>
            </div>

            <div class="status-bar" id="status-bar" style="display: none;">
                <span>参与者: <strong id="total-count">0</strong> 人</span>
                <span>|</span>
                <span>已抽取: <strong id="drawn-count">0</strong> 人</span>
            </div>
        </main>
    </div>

    <div class="winner-modal" id="winner-modal" style="display: none;">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <div class="celebration">🎉</div>
                <div class="modal-title">恭喜！</div>
            </div>
            <div class="modal-body">
                <div class="winner-avatar">
                    <img id="winner-avatar-img" src="" alt="中奖者头像">
                </div>
                <div class="winner-name" id="winner-name"></div>
                <div class="winner-round" id="winner-round"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="btn-continue">继续抽奖</button>
                <button class="btn-secondary" id="btn-view-winners">查看名单</button>
            </div>
        </div>
    </div>

    <div class="error-toast" id="error-toast" style="display: none;">
        <span id="error-message"></span>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
